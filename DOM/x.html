<!-- 
The DOM is a programming interface that represents an HTML document as a tree of objects. JavaScript uses the DOM to access and modify HTML elements.

Example:

<h1 id="heading">Hello</h1>
<button onclick="changeText()">Click</button>
function changeText() {
  document.getElementById("heading").innerText = "Hello Ishika!";
}

Here:

document → represents the entire HTML page.
getElementById() → selects an HTML element.
innerText → changes the text of that element.
In simple words:

HTML creates the webpage → DOM represents it → JavaScript modifies it. -->
