<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body style="background-color:#212121; color:#fff;">
  
    
    <div id="wrapper">
      <h1>Number guessing game</h1>
    <h5>Try and guess a random number between 1 and 100.</h5>
    <h5>You have 10 attempts to guess the right number.</h5>
    </br>
        <form class="form">
            <label2 for="guessField" id="guess">Guess a number</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="submit" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <h6 >Previous Guesses: <span class="guesses"></span></h6>
            <h6 >Guesses Remaining: <span class="lastResult">10</span></h6>
            <h6 class="lowOrHi"></h6>
        </div>
    </div>
    <script src="JavaScript.js"></script>
</body>
</html>
